name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter --version | tee version.log
          flutter create --org com.kareem --project-name sufra --platforms android . 2>&1 | tee create.log
          rm -f test/widget_test.dart
          sed -i 's/android:label="sufra"/android:label="سفرة"/' android/app/src/main/AndroidManifest.xml
          python3 ci/patch_manifest.py android/app/src/main/AndroidManifest.xml
          # Same signing key on every build, so a new APK installs over the old one.
          mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Analyze
        run: |
          flutter pub get 2>&1 | tee pubget.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || echo "ANALYZE_FAILED" >> analyze.log

      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee build.log
          cp build/app/outputs/flutter-apk/app-release.apk sufra-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: سفرة - نسخة ${{ github.run_number }}
          files: sufra-${{ github.run_number }}.apk
          body: |
            نزّل ملف الـ APK على جوال أندرويد وافتحه للتثبيت.
            الكود: ${{ github.sha }}

      - name: Publish logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp *.log /tmp/logs/ 2>/dev/null || true
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q
          git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "logs ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
